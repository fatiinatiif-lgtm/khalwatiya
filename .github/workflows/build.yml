name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p lib assets/books assets/indexes assets/texts assets/icon
          mv main.dart lib/
          mv awrad.pdf assets/books/
          mv fhris.txt assets/indexes/
          mv musabbaat.txt salawat_dardiriyya.txt manzuma.txt assets/texts/
          mv app_icon.png assets/icon/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name al_tariqa_al_khalwatiya_al_bakriya --org com.khalwatiya.bakriya .
      - run: rm -rf test
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="[^"]*"/android:label="الطريقة الخلوتية البكرية"/' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: khalwatiya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
